name: Build Android FocusLock Ocean APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Prepare Deep Ocean Sanctuary Android Project
        run: |
          set -e
          echo "=== Configuring Android Deep Ocean Sanctuary Project ==="

          # 1. Create standard Android directory tree
          mkdir -p app/src/main/java/com/vidhya/focuslock
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/res/anim
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/xml

          # 2. Locate and move any user-uploaded files from subfolders to proper locations
          find . -name "*.kt" -not -path "*/app/src/main/java/*" -exec cp -u {} app/src/main/java/com/vidhya/focuslock/ \; 2>/dev/null || true
          find . -name "activity_*.xml" -not -path "*/res/layout/*" -exec cp -u {} app/src/main/res/layout/ \; 2>/dev/null || true
          find . -name "item_*.xml" -not -path "*/res/layout/*" -exec cp -u {} app/src/main/res/layout/ \; 2>/dev/null || true
          find . -name "bg_*.xml" -not -path "*/res/drawable/*" -exec cp -u {} app/src/main/res/drawable/ \; 2>/dev/null || true
          find . -name "ic_launcher*.xml" -not -path "*/res/drawable/*" -not -path "*/res/mipmap*/*" -exec cp -u {} app/src/main/res/drawable/ \; 2>/dev/null || true
          find . -maxdepth 2 -name "AndroidManifest.xml" -not -path "*/app/src/main/*" -exec cp -u {} app/src/main/AndroidManifest.xml \; 2>/dev/null || true

          # 3. Write Ocean Sanctuary Animation XMLs
          cat << 'EOF' > app/src/main/res/anim/ocean_float.xml
          <?xml version="1.0" encoding="utf-8"?>
          <set xmlns:android="http://schemas.android.com/apk/res/android" android:interpolator="@android:anim/linear_interpolator" android:repeatMode="reverse" android:repeatCount="infinite">
              <translate android:fromXDelta="0" android:toXDelta="8dp" android:fromYDelta="0" android:toYDelta="-12dp" android:duration="1400" />
          </set>
          EOF

          cat << 'EOF' > app/src/main/res/anim/bubble_rise.xml
          <?xml version="1.0" encoding="utf-8"?>
          <set xmlns:android="http://schemas.android.com/apk/res/android" android:repeatMode="restart" android:repeatCount="infinite">
              <translate android:fromYDelta="0dp" android:toYDelta="-40dp" android:duration="2000" />
              <alpha android:fromAlpha="0.3" android:toAlpha="1.0" android:duration="1000" />
          </set>
          EOF

          cat << 'EOF' > app/src/main/res/anim/wave_sway.xml
          <?xml version="1.0" encoding="utf-8"?>
          <set xmlns:android="http://schemas.android.com/apk/res/android" android:repeatMode="reverse" android:repeatCount="infinite">
              <rotate android:fromDegrees="-3" android:toDegrees="3" android:pivotX="50%" android:pivotY="100%" android:duration="1600" />
          </set>
          EOF

          cat << 'EOF' > app/src/main/res/anim/bioluminescent_pulse.xml
          <?xml version="1.0" encoding="utf-8"?>
          <set xmlns:android="http://schemas.android.com/apk/res/android" android:repeatMode="reverse" android:repeatCount="infinite">
              <scale android:fromXScale="0.85" android:toXScale="1.15" android:fromYScale="0.85" android:toYScale="1.15" android:pivotX="50%" android:pivotY="50%" android:duration="900" />
              <alpha android:fromAlpha="0.5" android:toAlpha="1.0" android:duration="900" />
          </set>
          EOF

          # 4. Write Pure Deep Ocean Values & Colors
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">FocusLock Ocean Sanctuary</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/colors.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="white">#FFFFFFFF</color>
              <color name="ocean_primary">#06B6D4</color>
              <color name="ocean_secondary">#38BDF8</color>
              <color name="ocean_accent">#00F5D4</color>
              <color name="ocean_dark">#0B192C</color>
              <color name="ocean_surface">#0F1E36</color>
              <color name="ocean_card">#07192C</color>
              <color name="ocean_border">#0E3A5D</color>
              <color name="ocean_abyss">#020817</color>
              <color name="ocean_coral">#FF6B8B</color>
              <color name="ocean_gold">#FBBF24</color>
              <color name="bg_dark">#020817</color>
              <color name="text_secondary">#94A3B8</color>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/themes.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.FocusLock" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                  <item name="colorPrimary">@color/ocean_primary</item>
                  <item name="colorSecondary">@color/ocean_secondary</item>
                  <item name="android:statusBarColor">@color/ocean_abyss</item>
                  <item name="android:navigationBarColor">@color/ocean_abyss</item>
              </style>
              <style name="Theme.FocusLock.Fullscreen" parent="Theme.FocusLock">
                  <item name="android:windowFullscreen">true</item>
              </style>
              <style name="Theme.FocusLock.Dialog" parent="Theme.MaterialComponents.DayNight.Dialog" />
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/xml/accessibility_service_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowsChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault|flagIncludeNotImportantViews"
              android:canRetrieveWindowContent="false"
              android:description="@string/app_name"
              android:notificationTimeout="50" />
          EOF

          cat << 'EOF' > app/src/main/res/xml/device_admin_receiver.xml
          <?xml version="1.0" encoding="utf-8"?>
          <device-admin xmlns:android="http://schemas.android.com/apk/res/android"><uses-policies><force-lock /></uses-policies></device-admin>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_card.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"><solid android:color="#07192C"/><corners android:radius="16dp"/><stroke android:width="1dp" android:color="#0E3A5D"/></shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_search.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"><solid android:color="#030E1B"/><corners android:radius="12dp"/><stroke android:width="1dp" android:color="#0C4A6E"/></shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_pill.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"><solid android:color="#0C4A6E"/><corners android:radius="20dp"/></shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_foreground.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108"><path android:fillColor="#38BDF8" android:pathData="M30,30h48v48h-48z" /></vector>
          EOF

          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@color/ocean_dark" /><foreground android:drawable="@drawable/ic_launcher_foreground" /></adaptive-icon>
          EOF

          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@color/ocean_dark" /><foreground android:drawable="@drawable/ic_launcher_foreground" /></adaptive-icon>
          EOF

          find . -name "*.xml" -exec sed -i 's/^[ \t]*<?xml/<?xml/' {} + 2>/dev/null || true

          # 5. Write build.gradle.kts and settings.gradle.kts
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "FocusLock"
          include(":app")
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.vidhya.focuslock"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.vidhya.focuslock"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 6
                  versionName = "3.6.0-DeepOceanSanctuary"
              }
              buildTypes {
                  release { isMinifyEnabled = false }
                  debug { isMinifyEnabled = false }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.android.material:material:1.12.0")
              implementation("androidx.recyclerview:recyclerview:1.3.2")
              implementation("androidx.cardview:cardview:1.0.0")
              implementation("androidx.constraintlayout:constraintlayout:2.1.4")
          }
          EOF

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Upload Deep Ocean Sanctuary APK
        uses: actions/upload-artifact@v4
        with:
          name: FocusLock-v3.6.0-DeepOceanSanctuary-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
