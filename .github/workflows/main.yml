name: Build Android FocusLock APK

# Triggers whenever you push code or manually click "Run workflow" in GitHub
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build FocusLock APK
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download your repository files onto the runner
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up Java JDK 17 (Required for modern Android builds)
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # Step 3: Ensure Gradle wrapper script has execution permissions
      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      # Step 4: Compile the Debug Android APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      # Step 5: Save and publish the APK as a downloadable Artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FocusLock-v3.0.0-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
