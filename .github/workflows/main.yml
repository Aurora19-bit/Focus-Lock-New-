name: Build Android FocusLock APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Configure Android Project
        run: |
          echo "==> Verifying Android project structure..."
          
          # If project was uploaded into a subfolder, bring it to root
          if [ ! -d "app" ] && [ -d "FocusLock/app" ]; then
            cp -r FocusLock/* .
          fi
          
          # Ensure gradlew executable if present
          if [ -f "gradlew" ]; then
            chmod +x gradlew
          fi

          # Ensure root build.gradle.kts exists with correct plugin declarations
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          # Ensure settings.gradle.kts exists with required repository endpoints
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google {
                      content {
                          includeGroupByRegex("com\\.android.*")
                          includeGroupByRegex("com\\.google.*")
                          includeGroupByRegex("androidx.*")
                      }
                  }
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "FocusLock"
          include(":app")
          EOF

          # Clean XML headers to prevent parsing errors
          find app/src/main/res -name "*.xml" -exec sed -i "s/^[ \t]*<?xml/<?xml/" {} + 2>/dev/null || true

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Upload FocusLock APK
        uses: actions/upload-artifact@v4
        with:
          name: FocusLock-v3.0.0-APK
          path: |
            app/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/debug/*.apk
          retention-days: 14
