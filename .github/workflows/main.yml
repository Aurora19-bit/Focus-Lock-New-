name: Build FocusLock APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build FocusLock Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      # Configures Google & Maven repositories cleanly without EOF blocks
      - name: Configure Root Gradle Files
        run: |
          printf "pluginManagement {\n    repositories {\n        google()\n        mavenCentral()\n        gradlePluginPortal()\n    }\n}\ndependencyResolutionManagement {\n    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)\n    repositories {\n        google()\n        mavenCentral()\n    }\n}\nrootProject.name = \"FocusLock\"\ninclude(\":app\")\n" > settings.gradle.kts
          printf "plugins {\n    id(\"com.android.application\") version \"8.5.2\" apply false\n    id(\"org.jetbrains.kotlin.android\") version \"1.9.24\" apply false\n}\n" > build.gradle.kts

      # Compiles the FocusLock Debug APK
      - name: Build Debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      # Uploads the APK so you can download it
      - name: Upload FocusLock APK
        uses: actions/upload-artifact@v4
        with:
          name: FocusLock-v3.0.0-APK
          path: |
            app/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
