name: Build FocusLock APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build FocusLock Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      # Configures Google & Maven repositories and plugin versions automatically
      - name: Configure Gradle Repositories & Plugins
        run: |
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "FocusLock"
          if (file("app").exists() && file("app/build.gradle.kts").exists()) {
              include(":app")
          }
          EOF

          if [ -d "app" ] && [ -f "app/build.gradle.kts" ]; then
            cat << 'EOF' > build.gradle.kts
            plugins {
                id("com.android.application") version "8.5.2" apply false
                id("org.jetbrains.kotlin.android") version "1.9.24" apply false
            }
            EOF
          fi

      # Compiles the Debug APK
      - name: Build Debug APK
        run: |
          if [ -d "app" ] && [ -f "app/build.gradle.kts" ]; then
            gradle :app:assembleDebug --stacktrace --no-daemon
          else
            gradle assembleDebug --stacktrace --no-daemon
          fi

      # Uploads the APK so you can download it
      - name: Upload FocusLock APK
        uses: actions/upload-artifact@v4
        with:
          name: FocusLock-v3.0.0-APK
          path: |
            **/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
