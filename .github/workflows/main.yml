name: Build Android FocusLock APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build FocusLock APK
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout your repository code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Step 3: Set up Gradle (Works even if gradlew file is missing)
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # Step 4: Ensure gradlew exists or generate one automatically
      - name: Prepare Gradle Wrapper
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          elif [ -f "./gradle/wrapper/gradle-wrapper.jar" ]; then
            gradle wrapper
            chmod +x ./gradlew
          fi

      # Step 5: Build Debug APK (handles root or subfolder automatically)
      - name: Build Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace --no-daemon
          elif [ -f "./app/build.gradle.kts" ] || [ -f "./build.gradle.kts" ]; then
            gradle assembleDebug --stacktrace --no-daemon
          else
            # Find subfolder if files were uploaded inside a nested folder
            BUILD_DIR=$(find . -maxdepth 3 -name "build.gradle.kts" -o -name "build.gradle" | head -n 1 | xargs dirname)
            if [ -n "$BUILD_DIR" ]; then
              echo "Found project in $BUILD_DIR"
              cd "$BUILD_DIR"
              gradle assembleDebug --stacktrace --no-daemon
            else
              echo "❌ Error: Could not find build.gradle.kts or app files. Please upload your project files to the repository."
              exit 1
            fi
          fi

      # Step 6: Upload the generated APK file
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FocusLock-v3.0.0-APK
          path: |
            **/build/outputs/apk/debug/*.apk
          retention-days: 14
